# Lychee - Find broken hyperlinks
# https://github.com/lycheeverse/lychee
# 
# You can also run lychee via cmdline
# $ cargo install lychee
# $ lychee .

# Verbose program output
# Accepts log level: "error", "warn", "info", "debug", "trace"
verbose = "info"

# Don't show interactive progress bar while checking links.
no_progress = true

# Check the specified file extensions
extensions = ["md","txt","html", "rst"]

# Website timeout in seconds
timeout = 30

# Maximum number of retries for a request before failing
max_retries = 5

# Inter-request delay in seconds to avoid rate limiting
retry_wait_time = 10

# Exclude URLs and mail addresses from checking. The values are treated as regular expressions
exclude = [
    '^http://localhost*',

    # GitHub Pages links that may not exist in PR builds
    "https://qiskit-community.github.io/qrmi/.*",

    # IBM authenticated/API endpoints
    "https://iam.cloud.ibm.com/.*",
    "https://quantum.cloud.ibm.com/.*",
    "https://s3.us-east.cloud-object-storage.appdomain.cloud/.*",

    # Provider endpoints requiring authentication
    "https://resonance.meetiqm.com/.*",
    "https://api.alice-bob.com/.*",

    'dependencies/alice_bob_felis_client/felis_generated/docs/*',
    'dependencies/alice_bob_felis_client/felis_generated/src/*',
    'dependencies/alice_bob_felis_client/felis_generated/.openapi-generator/*',
    'dependencies/iqm_client/src/*',
    'dependencies/iqm_client/docs/*',
    'dependencies/quantum_compute_client/src/*',
    'dependencies/quantum_compute_client/docs/*',
    'dependencies/quantum_compute_client/.openapi-generator/*',
]
