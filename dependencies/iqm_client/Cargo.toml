[package]
name = "qrmi-iqm-server-client"
keywords = ["rest-api", "http-client", "api-bindings"]
repository.workspace = true
license.workspace = true
rust-version.workspace = true
edition.workspace = true
version.workspace = true
authors = ["support@iqm.tech"]
description = "IQM Server API client library for Rust"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
chrono = { version = "^0.4",  features = ["serde"] }
reqwest = { version = "0.12.14", default-features = false, features = ["json", "multipart", "rustls-tls"] }
bytes = "^1.0"

[lints.clippy]
empty_docs = "allow"
