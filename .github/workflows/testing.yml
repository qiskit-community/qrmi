---
# workflow that runs a major set of tests on a defined schedule 

name: Testing

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install latest dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest-cov coverage

      - name: Run standard tests
        run: |
          export COVERAGE_FILE=.coverage.unit

          pytest \
            python/tests/unit \
            --ignore=python/tests/compatibility \
            --cov=qrmi \
            --cov-report=

      - name: Install compatibility dependencies
        run: |
          # Use a separate venv: [iqm] needs qiskit<2.2, which conflicts with the
          # latest qiskit-ibm-runtime installed by [all] above.
          python -m venv "$RUNNER_TEMP/venv-compat"
          "$RUNNER_TEMP/venv-compat/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv-compat/bin/pip" install -e ".[iqm]" pytest pytest-cov coverage

      - name: Run compatibility tests
        run: |
          export COVERAGE_FILE=.coverage.compat

          "$RUNNER_TEMP/venv-compat/bin/pytest" \
            python/tests/compatibility \
            --cov=qrmi \
            --cov-report=

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

      - name: Upload compatibility coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-compat
          path: .coverage.compat
          include-hidden-files: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    needs:
      - tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Download compatibility coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-compat

      - name: Combine coverage data
        run: |
          coverage combine \
            .coverage.unit \
            .coverage.compat

      - name: Generate coverage report
        run: |
          coverage report --fail-under=70 > coverage.txt

      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage Report"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
