---
# workflow that runs a major set of tests on a defined schedule 

name: Testing

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest-cov

      - name: Run standard test suite
        run: |
          export COVERAGE_FILE=.coverage.unit

          pytest \
            python/tests/unit/ \
            --cov=qrmi \
            --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    needs:
      - unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Generate coverage report
        run: |

          mv .coverage.unit .coverage

          coverage report --fail-under=70
          coverage xml -o coverage.xml
          coverage html

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov