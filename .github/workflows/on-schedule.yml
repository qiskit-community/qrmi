---
# workflow that runs a major set of tests on a defined schedule
# ppc64le is handled separately in on-schedule-ppc64le.yml (Sunday) to avoid
# hitting the 6-hour GitHub Actions per-run limit.

name: Schedule

on:
  # Runs at 00:00 UTC every Saturday
  schedule:
  - cron: '0 0 * * 6'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:

  check-broken-links:
    if: github.repository_owner == 'qiskit-community'
    uses: ./.github/workflows/broken-links.yml

  # x86_64 and arm64 only. ppc64le is handled in on-schedule-ppc64le.yml.
  libqrmi:
    if: github.repository_owner == 'qiskit-community'
    uses: ./.github/workflows/libqrmi.yml
    with:
      arch-x86_64: true
      arch-ppc64le: false
      arch-arm64: true
      build-target: 'all'
      unit-test-target: 'all'
      lint-target: 'all'
      format-check: true
      libqrmi-tarball: true
      libqrmi-rpm-x86: true
      vendor-tarball: true
      artifact-prefix: 'schedule'

  # x86_64 and arm64 only. ppc64le is handled in on-schedule-ppc64le.yml.
  wheels:
    if: github.repository_owner == 'qiskit-community'
    uses: ./.github/workflows/wheels.yml
    with:
      arch-x86_64: true
      arch-ppc64le: false
      arch-arm64: true
      unit-test: true
      format-check: true
      lint: true
      sdist: true
      artifact-prefix: 'schedule'
